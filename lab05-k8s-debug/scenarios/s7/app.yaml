apiVersion: v1
kind: Namespace
metadata: {name: s7}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cruncher, namespace: s7}
spec:
  replicas: 1
  selector: {matchLabels: {app: cruncher}}
  template:
    metadata: {labels: {app: cruncher}}
    spec:
      containers:
        - name: cruncher
          image: polinux/stress
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "200M", "--vm-hang", "0"]
          resources:
            requests: {memory: 64Mi, cpu: 50m}
            limits: {memory: 100Mi, cpu: 200m}
