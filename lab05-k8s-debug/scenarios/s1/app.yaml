apiVersion: v1
kind: Namespace
metadata: {name: s1}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: s1}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpne
          ports: [{containerPort: 80}]
