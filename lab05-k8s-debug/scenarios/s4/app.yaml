apiVersion: v1
kind: Namespace
metadata: {name: s4}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: s4}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: s4}
spec:
  selector: {app: webapp}
  ports: [{port: 80, targetPort: 8080}]
