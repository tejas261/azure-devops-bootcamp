apiVersion: v1
kind: Namespace
metadata: {name: s5}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: batch, namespace: s5}
spec:
  replicas: 3
  selector: {matchLabels: {app: batch}}
  template:
    metadata: {labels: {app: batch}}
    spec:
      nodeSelector: {disktype: ssd}
      containers:
        - name: batch
          image: nginx:1.27-alpine
          resources:
            requests: {cpu: "4", memory: 16Gi}
