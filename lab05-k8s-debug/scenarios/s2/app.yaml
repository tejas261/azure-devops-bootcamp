apiVersion: v1
kind: Namespace
metadata: {name: s2}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: orders, namespace: s2}
spec:
  replicas: 2
  selector: {matchLabels: {app: orders}}
  template:
    metadata: {labels: {app: orders}}
    spec:
      containers:
        - name: orders
          image: __ACR__/orders:v1
          ports: [{containerPort: 80}]
