#cloud-config
package_update: true
packages:
  - docker.io
  - git
  - curl
runcmd:
  - systemctl enable --now docker
  - docker volume create jenkins_home
  - docker run -d --name jenkins --restart unless-stopped -p 8080:8080 -p 50000:50000 -v jenkins_home:/var/jenkins_home -v /var/run/docker.sock:/var/run/docker.sock jenkins/jenkins:lts-jdk17
  # LAB SHORTCUT (see README): world-writable docker socket. Do not do this in real life.
  - chmod 666 /var/run/docker.sock
  - sleep 30
  - docker exec -u root jenkins sh -c "apt-get update && apt-get install -y docker.io curl"
